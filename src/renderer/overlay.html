<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #badge {
    margin: 4px; height: 52px; border-radius: 26px; box-sizing: border-box;
    background: rgba(15, 20, 32, .92); border: 2px solid var(--c, #64748b);
    display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #e8edf7;
    box-shadow: 0 4px 18px rgba(0,0,0,.45); position: relative; overflow: hidden;
  }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c, #64748b); box-shadow: 0 0 10px var(--c, #64748b); flex: none; }
  #txt { font-size: 14px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  #sub { font-size: 11px; opacity: .75; white-space: nowrap; }
  #col { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  #cam { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; opacity: .9; flex: none; }
  #camdot { width: 9px; height: 9px; border-radius: 50%; background: #475569; }
  #camdot.on { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: p 1.6s infinite; }
  @keyframes p { 50% { opacity: .35; } }
  #bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--c, #64748b); transition: width .08s linear; }
</style>
</head>
<body>
<div id="badge"><div id="dot"></div><div id="col"><div id="txt">…</div><div id="sub"></div></div>
  <div id="cam"><div id="camdot"></div><span id="camtxt">cam</span></div><div id="bar"></div></div>
<script>
  const C = { active: '#22c55e', paused: '#eab308', locked: '#ef4444', nohand: '#64748b' };
  const $ = (i) => document.getElementById(i);
  function render(s) {
    let key = s.mode, txt, sub = '';
    if (s.mode === 'active') {
      txt = 'ATTIVO'; sub = s.hand ? 'mano vista' : 'mano non vista';
      if (!s.hand) key = 'nohand';
    } else if (s.mode === 'paused') {
      txt = 'IN PAUSA'; sub = s.hand ? 'mano aperta ferma = attiva' : 'mano non vista';
    } else { txt = 'BLOCCATO'; sub = 'sblocca con Ctrl+Alt+K'; }
    if (s.holdKind === 'toggle' && s.holdProgress > 0.05) sub = s.mode === 'active' ? 'tieni ferma… pausa' : 'tieni ferma… attivo';
    if (s.holdKind === 'lock' && s.holdProgress > 0.05) { sub = 'pugno… BLOCCO'; }
    document.documentElement.style.setProperty('--c', C[key]);
    $('txt').textContent = txt; $('sub').textContent = sub;
    $('camdot').className = s.camera === 'on' ? 'on' : '';
    $('camtxt').textContent = s.camera === 'on' ? 'CAMERA' : s.camera === 'error' ? 'ERRORE' : 'cam spenta';
    $('bar').style.width = (s.holdKind && s.holdProgress > 0.05 ? Math.round(s.holdProgress * 100) : 0) + '%';
  }
  if (window.overlayAPI) overlayAPI.onState(render);
</script>
</body>
</html>
