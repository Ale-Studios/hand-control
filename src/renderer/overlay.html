<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif; user-select: none; }
  #badge {
    margin: 4px; height: 52px; border-radius: 3px; box-sizing: border-box;
    background: rgba(16,18,21,.72); border: 1px solid rgba(255,255,255,.16); border-left: 3px solid var(--c, #6b7380);
    display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #e8ebef;
    box-shadow: 0 6px 22px rgba(0,0,0,.45), 0 0 14px color-mix(in srgb, var(--c, #6b7380) 22%, transparent);
    position: relative; overflow: hidden;
  }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c, #6b7380); box-shadow: 0 0 10px var(--c, #6b7380); flex: none; }
  #txt { font-size: 13px; font-weight: 400; letter-spacing: .28em; white-space: nowrap; }
  #sub { font-size: 11px; opacity: .72; white-space: nowrap; letter-spacing: .03em; }
  #col { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  #cam { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11px; letter-spacing: .08em; opacity: .9; flex: none; }
  #camdot { width: 9px; height: 9px; border-radius: 50%; background: #4b525c; }
  #camdot.on { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: p 1.6s infinite; }
  @keyframes p { 50% { opacity: .35; } }
  #bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--c, #6b7380); transition: width .08s linear; }
</style>
</head>
<body>
<div id="badge"><div id="dot"></div><div id="col"><div id="txt">…</div><div id="sub"></div></div>
  <div id="cam"><div id="camdot"></div><span id="camtxt">cam</span></div><div id="bar"></div></div>
<script>
  const C = { active: '#3ddc97', paused: '#f2b84b', locked: '#ef5350', nohand: '#9aa3af' };
  const $ = (i) => document.getElementById(i);
  function render(s) {
    let key = s.mode, txt, sub = '';
    if (s.mode === 'active') {
      txt = 'ACTIVE'; sub = s.hand ? 'hand seen' : 'hand not seen';
      if (!s.hand) key = 'nohand';
    } else if (s.mode === 'paused') {
      txt = 'PAUSED'; sub = s.hand ? 'open hand held still = activate' : 'hand not seen';
    } else { txt = 'LOCKED'; sub = 'unlock with Ctrl+Alt+K'; }
    if (s.dry && s.mode === 'active') { txt = 'TEST MODE'; sub = 'nothing is sent to Windows'; }
    if (s.holdKind === 'toggle' && s.holdProgress > 0.05) sub = s.mode === 'active' ? 'hold still… pause' : 'hold still… activate';
    if (s.holdKind === 'lock' && s.holdProgress > 0.05) { sub = 'fist… LOCK'; }
    document.documentElement.style.setProperty('--c', C[key]);
    $('txt').textContent = txt; $('sub').textContent = sub;
    $('camdot').className = s.camera === 'on' ? 'on' : '';
    $('camtxt').textContent = s.camera === 'on' ? 'CAMERA' : s.camera === 'error' ? 'ERROR' : 'cam off';
    $('bar').style.width = (s.holdKind && s.holdProgress > 0.05 ? Math.round(s.holdProgress * 100) : 0) + '%';
  }
  if (window.overlayAPI) overlayAPI.onState(render);
</script>
</body>
</html>
