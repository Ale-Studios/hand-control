<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif; }
  #grid { display: grid; gap: 10px; padding: 10px; box-sizing: border-box; width: 100vw; height: 100vh;
    background: rgba(14, 16, 19, .82); border: 1px solid rgba(255, 255, 255, .16); border-radius: 4px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .55); }
  button { font: 400 15px Bahnschrift, "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #e9edf1; cursor: pointer;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .14); border-radius: 3px; padding: 6px; transition: background .08s, border-color .08s, box-shadow .08s; }
  button:hover { background: rgba(196, 236, 250, .16); border-color: #c4ecfa; box-shadow: 0 0 18px rgba(196, 236, 250, .25); }
  button:active { background: rgba(196, 236, 250, .3); }
  button.close { color: #ff9a97; border-color: rgba(239, 83, 80, .5); }
  button.close:hover { background: rgba(239, 83, 80, .22); border-color: #ef5350; box-shadow: 0 0 18px rgba(239, 83, 80, .25); }
</style>
</head>
<body>
<div id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  if (window.launcherAPI) launcherAPI.onTiles(({ names, cols }) => {
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    const all = [...names, 'Close'];
    all.forEach((name, i) => {
      const b = document.createElement('button');
      b.textContent = name;
      if (i === names.length) b.className = 'close';
      b.addEventListener('click', () => launcherAPI.choose(i));
      grid.appendChild(b);
    });
    grid.style.gridTemplateRows = `repeat(${Math.ceil(all.length / cols)}, 1fr)`;
  });
</script>
</body>
</html>
